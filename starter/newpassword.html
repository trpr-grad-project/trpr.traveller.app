<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#359EFF",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1923"
                    },
                    fontFamily: {
                        display: "Plus Jakarta Sans"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    }
                }
            }
        };
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#102222] dark:text-white min-h-screen flex flex-col antialiased selection:bg-primary/30">
<header class="flex items-center justify-between px-4 py-4 sticky top-0 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md z-20 transition-colors">
<button class="group flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-colors active:scale-95">
<span class="material-symbols-outlined text-2xl text-slate-800 dark:text-slate-100 group-hover:-translate-x-0.5 transition-transform">arrow_back_ios_new</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight text-center flex-1">Reset Password</h2>
<div class="size-10"></div> 
</header>
<main class="flex-1 flex flex-col px-6 pb-8 max-w-lg mx-auto w-full">
<div class="pt-4 pb-8">
<div class="inline-flex items-center justify-center size-14 rounded-2xl bg-primary/20 text-primary mb-6 shadow-sm shadow-primary/10">
<span class="material-symbols-outlined text-[32px]">lock_reset</span>
</div>
<h1 class="text-3xl md:text-4xl font-bold leading-tight mb-3 text-slate-900 dark:text-white">
                Secure Your <br/>Account
            </h1>
<p class="text-base text-slate-500 dark:text-slate-400 font-medium leading-relaxed max-w-sm">
                Your new password must be different from previously used passwords.
            </p>
</div>
<div class="space-y-6">
<div class="space-y-2 group/field">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">New Password</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-white dark:bg-[#1a2c2c] border border-slate-200 dark:border-slate-700 rounded-xl px-4 text-lg text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all pr-12 shadow-sm" placeholder="Enter new password" type="password" value="Travel2024"/>
<button class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">Strength</span>
<span class="text-xs font-bold text-primary tracking-wide">Medium</span>
</div>
<div class="flex gap-1.5 h-1.5 w-full">
<div class="h-full w-1/4 rounded-full bg-primary shadow-[0_0_8px_rgba(53,158,255,0.4)]"></div>
<div class="h-full w-1/4 rounded-full bg-primary shadow-[0_0_8px_rgba(53,158,255,0.4)]"></div>
<div class="h-full w-1/4 rounded-full bg-primary/20 dark:bg-primary/10"></div>
<div class="h-full w-1/4 rounded-full bg-slate-200 dark:bg-slate-800"></div>
</div>
</div>
<div class="py-2 space-y-3">
<div class="flex items-center gap-3 text-sm text-slate-600 dark:text-slate-300 transition-colors">
<div class="size-5 rounded-full bg-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[14px] text-white font-bold">check</span>
</div>
<span class="font-medium">At least 8 characters</span>
</div>
<div class="flex items-center gap-3 text-sm text-slate-600 dark:text-slate-300 transition-colors">
<div class="size-5 rounded-full bg-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[14px] text-white font-bold">check</span>
</div>
<span class="font-medium">Contains a number</span>
</div>
<div class="flex items-center gap-3 text-sm text-slate-400 dark:text-slate-500 transition-colors opacity-80">
<div class="size-5 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0">
</div>
<span class="font-medium">Contains a special character</span>
</div>
</div>
<div class="space-y-2 group/field pt-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Confirm Password</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-white dark:bg-[#1a2c2c] border border-slate-200 dark:border-slate-700 rounded-xl px-4 text-lg text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all pr-12 shadow-sm" placeholder="Re-enter new password" type="password"/>
<button class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
</div>
<div class="mt-auto pt-10 pb-4">
<button class="w-full bg-primary hover:bg-[#2a8de6] active:scale-[0.98] text-white text-base font-bold h-14 rounded-xl shadow-lg shadow-primary/25 transition-all flex items-center justify-center group">
<span>Update Password</span>
</button>
</div>
</main>

</body></html>
