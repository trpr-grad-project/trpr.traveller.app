<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - Trip Planner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#359EFF",
                        "header-blue": "#003B46",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1923",
                        "segmented-bg": "#E0E7E7"
                    },
                    fontFamily: {
                        display: "Plus Jakarta Sans"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    }
                }
            }
        };
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-center sm:justify-start">
<div class="w-full max-w-md min-h-screen bg-background-light dark:bg-background-dark flex flex-col relative overflow-hidden shadow-2xl sm:min-h-[812px] sm:max-h-[900px] sm:h-auto sm:rounded-3xl sm:border-[8px] sm:border-gray-900 sm:my-8">
<div class="flex items-center p-4 pt-6 pb-2 justify-between">
<button aria-label="Go back" class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined !text-[28px]">arrow_back_ios_new</span>
</button>
<div class="flex gap-4 items-center">
<button class="text-slate-500 dark:text-slate-400 font-medium text-sm">Help</button>
</div>
</div>
<div class="px-6 py-2 flex justify-center">
<div class="w-32 h-32 bg-primary/20 dark:bg-primary/10 rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined !text-6xl text-primary">lock_reset</span>
</div>
</div>
<div class="flex-1 flex flex-col px-6">
<h1 class="text-[#0F172A] dark:text-[#E2E8F0] tracking-tight text-[32px] font-bold leading-tight pb-3 pt-2">
                Forgot Password?
            </h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-relaxed pb-8">
                Don't worry! It happens. Please enter the email or phone number associated with your account to receive a reset code.
            </p>
<div class="flex gap-2 mb-6 bg-segmented-bg dark:bg-slate-800/50 p-1 rounded-xl">
<button class="flex-1 py-2.5 px-4 rounded-lg bg-white dark:bg-slate-700 shadow-sm text-primary font-bold text-sm transition-all text-center">
                    Email
                </button>
<button class="flex-1 py-2.5 px-4 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-medium text-sm transition-all text-center">
                    Phone
                </button>
</div>
<div class="flex flex-col gap-4 mb-8">
<label class="flex flex-col flex-1 group">
<p class="text-slate-900 dark:text-white text-sm font-semibold leading-normal pb-2 ml-1">Email Address</p>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#2D2D2D] dark:text-[#94A3B8]">mail</span>
</div>
<input class="form-input flex w-full resize-none overflow-hidden rounded-xl text-[#0F172A] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary h-14 placeholder:text-[#0F172A] dark:placeholder:text-slate-400 pl-12 pr-4 text-base font-medium leading-normal transition-all" placeholder="user@example.com" type="email" value=""/>
</div>
</label>
</div>
<button class="w-full h-14 bg-primary hover:bg-[#2e8ce0] active:scale-[0.98] transition-all rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
<span class="text-white font-bold text-lg">Send Code</span>
</button>
<div class="flex-1"></div>
<div class="w-full py-8 text-center">
<p class="text-slate-500 dark:text-slate-400 text-sm">
                    Remember password? 
                    <a class="text-slate-900 dark:text-white font-bold hover:underline decoration-primary decoration-2 underline-offset-4" href="#">Log in</a>
</p>
</div>
</div>
<div class="h-2 bg-background-light dark:bg-background-dark w-full"></div>
</div>

</body></html>
